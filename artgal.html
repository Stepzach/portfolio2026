<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEOUL ART BOOK FAIR — Experimental Gallery</title>

<style>
  :root {
    --paper: #fafafa;
    --ink: #111;
    --muted: #777;
  }

  * {
    box-sizing: border-box;
  }

  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    scroll-snap-type: y mandatory;
    overflow-y: scroll;
    scrollbar-width: none;
    scroll-behavior: smooth;
  }

  body::-webkit-scrollbar {
    display: none;
  }

  /* --- MINIMAL DYNAMIC HEADER --- */

  #header-nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 90px;
    z-index: 50;

    color: black;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;

    transition:
      height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  #header-nav.expanded {
    height: 200px;
   
    mix-blend-mode: normal;
  }

  .nav-spacer {
    width: 100%;
    pointer-events: none;
  }

  /* --- NAV ITEMS --- */

  .nav-item {
    position: absolute;
    left: 50%;
    top: 0;

    transform:
      translate(-50%, var(--ty, 24px))
      scale(var(--s, 1));

    opacity: var(--o, 0);
    filter: blur(var(--b, 0px));

    transition:
      transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
      opacity 0.8s ease,
      filter 0.8s ease;

    white-space: nowrap;
    pointer-events: none;
  }

  .nav-item.no-transform-transition {
    transition:
      opacity 0.8s ease,
      filter 0.8s ease !important;
  }

  .nav-item.active {
    font-weight: bold;
    pointer-events: auto;
  }

  #header-nav.expanded .nav-item {
    pointer-events: auto;
  }

  #header-nav.expanded .nav-item:hover {
    opacity: 1 !important;

    transition:
      transform var(--t-duration, 0.8s)
        cubic-bezier(0.16, 1, 0.3, 1),
      opacity 0.2s ease,
      filter 0.8s ease;
  }

  #header-nav.is-scrolling .nav-item {
    pointer-events: none !important;
  }

  #header-nav:not(.expanded) .nav-item {
    pointer-events: auto;
  }

  /* ------------------------------------------------
     FAINT VISUAL SCROLLBAR

     This is NOT a native scrollbar.
     It does not affect scrolling behavior.
     It simply mirrors navScrollOffset visually.
  ------------------------------------------------ */

  .nav-scrollbar {
    position: absolute;
    top: 12px;
    right: 25%;

    width: 3px;
    height: 126px;

    opacity: 0;
    pointer-events: none;

    transition: opacity 0.4s ease;
  }

  #header-nav.expanded .nav-scrollbar {
    opacity: 1;
  }

  /*
    Hide the visual scrollbar when the
    first or second navigation item is active.
  */
  #header-nav.expanded.hide-nav-scrollbar .nav-scrollbar {
    opacity: 0;
  }

  /* Very faint track */

  .nav-scrollbar::before {
    content: "";
    position: absolute;

    inset: 0;

    background: rgba(0, 0, 0, 0.05);
    border-radius: 10px;
  }

  /* Moving thumb */

  .nav-scrollbar-thumb {
    position: absolute;

    top: 0;
    left: 0;

    width: 3px;
    height: 32px;

    background: rgba(0, 0, 0, 0.18);
    border-radius: 10px;

    transition: top 0.05s linear;
  }

  /* Slightly stronger while actively scrolling */

  #header-nav.is-scrolling .nav-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.24);
  }


  /* --- FULL SCREEN PANELS --- */

  .panel {
    height: 100vh;
    width: 100vw;

    scroll-snap-align: start;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    position: relative;

    padding: 80px 5%;
  }


  /* --- TYPOGRAPHY & CAPTIONS --- */

  .intro-text,
  .outro-text {
    text-align: center;
    font-size: 13px;
    line-height: 1.6;
  }

  .intro-text p,
  .outro-text p {
    margin: 0 0 16px 0;
  }

  a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--muted);
    padding-bottom: 2px;
  }


  /* --- IMAGES --- */

  .image-wrapper {
    height: 60vh;
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    margin-bottom: 30px;
  }

  img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;

    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
  }


  /* --- CAPTIONS --- */

  figcaption {
    text-align: center;
    font-size: 11px;
  }

  figcaption b {
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  figcaption span {
    font-weight: normal;
    color: var(--muted);
  }


  /* --- SCROLL INDICATOR --- */

  .scroll-indicator {
    position: absolute;
    bottom: 30px;

    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;

    color: var(--muted);

    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% {
      opacity: 0.3;
      transform: translateY(0);
    }

    50% {
      opacity: 1;
      transform: translateY(3px);
    }

    100% {
      opacity: 0.3;
      transform: translateY(0);
    }
  }


  /* --- FIXED NAV --- */

  .fixed-nav {
    position: fixed;
    bottom: 24px;
    right: 24px;

    font-size: 10px;
    text-transform: uppercase;

    z-index: 50;
  }

  .fixed-nav a {
    border: none;
    font-weight: bold;
  }

  .fixed-nav a:hover {
    color: var(--muted);
  }


  /* --- MOBILE --- */

  @media (max-width: 760px) {
    .image-wrapper {
      height: 50vh;
    }
  }
  @media (min-width: 400px) {
    .nav-scrollbar {
   
    right: 30%;

  
  }
  }
  @media (min-width: 500px) {
    .nav-scrollbar {
   
    right: 35%;

  
  }
  }
@media (min-width: 800px) {
    .nav-scrollbar {
   
    right: 40%;

  
  }
  }
  @media (min-width: 1100px) {
    .nav-scrollbar {
   
    right: 43%;

  
  }
  }
@media (min-width: 1430px) {
    .nav-scrollbar {
   
    right: 44%;

  
  }
  }

</style>

</head>

<body>

<script>

document.addEventListener("DOMContentLoaded", () => {

  const headerNav = document.getElementById("header-nav");
  const panels = document.querySelectorAll(".panel");

  const navItems = [];

  /* Visual scrollbar thumb */
  const navScrollbarThumb =
    document.querySelector(".nav-scrollbar-thumb");


  let currentIndex = 0;
  let isExpanded = false;

  /*
    This is still the actual scrolling mechanism.
    The visual scrollbar does not replace it.
  */
  let navScrollOffset = 0;

  let isDragging = false;
  let startY = 0;
  let hoverTimeout;

  let lastScrollTop = window.scrollY;


  /* ==================================================
     HOVER / SCROLL STATE
  ================================================== */

  function disableHoversDuringScroll() {

    headerNav.classList.add("is-scrolling");

    clearTimeout(hoverTimeout);

    hoverTimeout = setTimeout(() => {

      headerNav.classList.remove("is-scrolling");

    }, 150);
  }


  /* ==================================================
     CLAMP NAVIGATION SCROLL
  ================================================== */

  function clampNavScroll() {

    const itemSpacing = 24;

    const maxOffset =
      Math.max(
        0,
        (currentIndex - 1) * itemSpacing
      );

    const minOffset = 0;


    if (navScrollOffset > maxOffset) {
      navScrollOffset = maxOffset;
    }

    if (navScrollOffset < minOffset) {
      navScrollOffset = minOffset;
    }
  }


  /* ==================================================
     VISUAL SCROLLBAR
     
     IMPORTANT:
     This only reflects navScrollOffset.
     It never controls the scrolling itself.
  ================================================== */

  function updateScrollbar() {

    if (!navScrollbarThumb) return;


    /*
      Hide the visual scrollbar when the first
      or second navigation item is active.

      currentIndex:
      0 = first item
      1 = second item
      2+ = scrollbar allowed
    */
    if (isExpanded && currentIndex <= 1) {

      headerNav.classList.add(
        "hide-nav-scrollbar"
      );

    } else {

      headerNav.classList.remove(
        "hide-nav-scrollbar"
      );

    }


    const itemSpacing = 24;

    const totalItems = navItems.length;

    /*
      Same maximum offset used by the existing
      custom navigation scrolling.
    */

    const maxOffset =
      Math.max(
        0,
        (currentIndex - 1) * itemSpacing
      );


    /*
      When there is no scrollable range,
      keep the thumb at the top.
    */

    if (!isExpanded || maxOffset <= 0) {

      navScrollbarThumb.style.top = "0px";

      return;
    }


    /*
      Dimensions of the visual scrollbar.
    */

    const trackHeight = 150;
    const thumbHeight = 32;

    const maxThumbTop =
      trackHeight - thumbHeight;


    /*
      Convert the existing nav scroll position
      into a 0–1 progress value.
    */

    const progress =
      navScrollOffset / maxOffset;


    /*
      Keep progress safely between 0 and 1.
    */

    const clampedProgress =
      Math.max(
        0,
        Math.min(1, progress)
      );


    /*
      Move only the visual thumb.
    */

    navScrollbarThumb.style.top =
      `${clampedProgress * maxThumbTop}px`;
  }


  /* ==================================================
     COLLAPSE MENU
  ================================================== */

  function collapseMenu() {

    if (!isExpanded) return;


    isExpanded = false;

    headerNav.classList.remove("expanded");

    updateNav(true);
  }


  /* ==================================================
     BUILD HEADER NAVIGATION
  ================================================== */

  panels.forEach((panel, index) => {

    if (!panel.id) {
      panel.id = `panel-${index}`;
    }


    const item =
      document.createElement("div");

    item.classList.add("nav-item");

    item.textContent =
      panel.getAttribute("data-title");


    item.addEventListener("click", (e) => {

      e.stopPropagation();


      if (isDragging) return;


      if (isExpanded) {

        panel.scrollIntoView({
          behavior: "smooth"
        });

        collapseMenu();

      } else {

        navScrollOffset = 0;

        isExpanded = true;

        headerNav.classList.add("expanded");

        lastScrollTop = window.scrollY;

        updateNav(true);
      }

    });


    navItems.push(item);

    headerNav.appendChild(item);

  });


  /* ==================================================
     OUTER HEADER CLICK
  ================================================== */

  headerNav.addEventListener("click", () => {

    if (isDragging) return;


    if (!isExpanded) {

      navScrollOffset = 0;

      isExpanded = true;

      headerNav.classList.add("expanded");

      lastScrollTop = window.scrollY;

      updateNav(true);

    } else {

      collapseMenu();

    }

  });


  /* ==================================================
     DESKTOP WHEEL SCROLL
     
     UNCHANGED:
     This is still custom scrolling using
     navScrollOffset.
  ================================================== */

  headerNav.addEventListener(
    "wheel",
    (e) => {

      if (!isExpanded) return;

      e.preventDefault();

      disableHoversDuringScroll();


      navScrollOffset -= e.deltaY;


      clampNavScroll();

      updateNav(false);

    },
    {
      passive: false
    }
  );


  /* ==================================================
     MOBILE TOUCH START
  ================================================== */

  headerNav.addEventListener(
    "touchstart",
    (e) => {

      if (!isExpanded) return;

      startY =
        e.touches[0].clientY;

      isDragging = false;

    },
    {
      passive: true
    }
  );


  /* ==================================================
     MOBILE TOUCH MOVE
     
     UNCHANGED:
     Still uses navScrollOffset.
  ================================================== */

  headerNav.addEventListener(
    "touchmove",
    (e) => {

      if (!isExpanded) return;

      e.preventDefault();

      disableHoversDuringScroll();


      const y =
        e.touches[0].clientY;


      const deltaY =
        y - startY;


      if (Math.abs(deltaY) > 3) {
        isDragging = true;
      }


      navScrollOffset += deltaY;

      startY = y;


      clampNavScroll();

      updateNav(false);

    },
    {
      passive: false
    }
  );


  /* ==================================================
     TOUCH END
  ================================================== */

  headerNav.addEventListener(
    "touchend",
    () => {

      setTimeout(() => {

        isDragging = false;

      }, 50);

    }
  );


  /* ==================================================
     UPDATE NAVIGATION POSITIONS
  ================================================== */

  function updateNav(useTransition = true) {

    const itemSpacing = 24;

    const baseTy = 34;


    navItems.forEach((item, i) => {

      item.style.setProperty(
        "--t-duration",
        useTransition
          ? "0.8s"
          : "0s"
      );


      item.classList.toggle(
        "active",
        i === currentIndex
      );


      /* ----------------------------------------------
         EXPANDED
      ---------------------------------------------- */

      if (isExpanded) {

        item.style.setProperty(
          "--ty",
          `${
            baseTy +
            ((i - currentIndex) * itemSpacing) +
            navScrollOffset
          }px`
        );

        item.style.setProperty(
          "--s",
          "1"
        );

        item.style.setProperty(
          "--o",
          i === currentIndex
            ? "1"
            : "0.4"
        );

        item.style.setProperty(
          "--b",
          "0px"
        );


      }

      /* ----------------------------------------------
         COLLAPSED
      ---------------------------------------------- */

      else {

        if (i === currentIndex) {

          item.style.setProperty(
            "--ty",
            "34px"
          );

          item.style.setProperty(
            "--s",
            "1"
          );

          item.style.setProperty(
            "--o",
            "1"
          );

          item.style.setProperty(
            "--b",
            "0px"
          );


        }

        else if (i === currentIndex - 1) {

          item.style.setProperty(
            "--ty",
            "10px"
          );

          item.style.setProperty(
            "--s",
            "0.9"
          );

          item.style.setProperty(
            "--o",
            "0.35"
          );

          item.style.setProperty(
            "--b",
            "2px"
          );


        }

        else if (i === currentIndex + 1) {

          item.style.setProperty(
            "--ty",
            "58px"
          );

          item.style.setProperty(
            "--s",
            "0.9"
          );

          item.style.setProperty(
            "--o",
            "0.35"
          );

          item.style.setProperty(
            "--b",
            "2px"
          );


        }

        else if (i < currentIndex) {

          item.style.setProperty(
            "--ty",
            "-16px"
          );

          item.style.setProperty(
            "--s",
            "0.8"
          );

          item.style.setProperty(
            "--o",
            "0"
          );

          item.style.setProperty(
            "--b",
            "4px"
          );


        }

        else {

          item.style.setProperty(
            "--ty",
            "84px"
          );

          item.style.setProperty(
            "--s",
            "0.8"
          );

          item.style.setProperty(
            "--o",
            "0"
          );

          item.style.setProperty(
            "--b",
            "4px"
          );
        }
      }
    });


    /*
      Update the visual scrollbar after the
      navigation positions have been updated.
    */

    updateScrollbar();
  }


  /* ==================================================
     INTERSECTION OBSERVER
  ================================================== */

  const observer =
    new IntersectionObserver(
      (entries) => {

        let changed = false;


        entries.forEach((entry) => {

          if (entry.isIntersecting) {

            currentIndex =
              Array.from(panels)
                .indexOf(entry.target);

            changed = true;
          }

        });


        if (changed) {

          updateNav(true);

        }

      },
      {
        root: null,
        threshold: 0.5
      }
    );


  panels.forEach((panel) => {

    observer.observe(panel);

  });


  /* ==================================================
     COLLAPSE HEADER WHEN PAGE ITSELF SCROLLS
  ================================================== */

  document.addEventListener(
    "wheel",
    (e) => {

      if (
        isExpanded &&
        !headerNav.contains(e.target)
      ) {

        isExpanded = false;

        headerNav.classList.remove(
          "expanded"
        );

        updateNav(true);
      }

    },
    {
      passive: true
    }
  );


  document.addEventListener(
    "touchmove",
    (e) => {

      if (
        isExpanded &&
        !headerNav.contains(e.target)
      ) {

        isExpanded = false;

        headerNav.classList.remove(
          "expanded"
        );

        updateNav(true);
      }

    },
    {
      passive: true
    }
  );


  /* ==================================================
     RESIZE
  ================================================== */

  window.addEventListener(
    "resize",
    () => {

      if (isExpanded) {
        updateNav(false);
      }

    }
  );


  /* ==================================================
     INITIAL STATE
  ================================================== */

  updateNav(true);

});

</script>

</body>
