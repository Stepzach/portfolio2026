<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEOUL ART BOOK FAIR — Experimental Gallery</title>

<style>
  :root {
    --paper: #fff;
    --ink: #111;
    --muted: #111;
  }

  * {
    box-sizing: border-box;
  }

  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    height: 100svh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    scroll-snap-type: y mandatory;
    overflow-y: scroll;
    scrollbar-width: none;
    scroll-behavior: smooth;
  }

  body::-webkit-scrollbar {
    display: none;
  }

  /* --- MINIMAL DYNAMIC HEADER --- */

  #header-nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 90px;
    z-index: 50;

    color: black;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;

    transition:
      height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  #header-nav.expanded {
    height: 200px;
    mix-blend-mode: normal;
  }

  .nav-spacer {
    width: 100%;
    pointer-events: none;
  }

  /* --- NAV ITEMS --- */

  .nav-item {
    position: absolute;
    left: 50%;
    top: 0;

    transform:
      translate(-50%, var(--ty, 24px))
      scale(var(--s, 1));

    opacity: var(--o, 0);
    filter: blur(var(--b, 3px));

    transition:
      transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
      opacity 0.8s ease,
      filter 0.8s ease;

    white-space: nowrap;
    pointer-events: none;
  }

  .nav-item.no-transform-transition {
    transition:
      opacity 0.8s ease,
      filter 0.8s ease !important;
  }

  .nav-item.active {
    font-weight: bold;
    pointer-events: auto;


  }

  #header-nav.expanded .nav-item {
    pointer-events: auto;
  }

  #header-nav.expanded .nav-item:hover {
    opacity: 1 !important;

    transition:
      transform var(--t-duration, 0.8s)
        cubic-bezier(0.16, 1, 0.3, 1),
      opacity 0.2s ease,
      filter 0.8s ease;
  }

  #header-nav.is-scrolling .nav-item {
    pointer-events: none !important;
  }

  #header-nav:not(.expanded) .nav-item {
    pointer-events: auto;
  }

  /* --- FULL SCREEN PANELS --- */

  .panel {
    height: 100vh;
    width: 100vw;

    scroll-snap-align: start;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    position: relative;

    padding: 80px 5%;
  }

  /* --- TYPOGRAPHY & CAPTIONS --- */

  .intro-text,
  .outro-text {
    text-align: center;
    font-size: 13px;
    line-height: 1.6;
  }

  .intro-text p,
  .outro-text p {
    margin: 0 0 16px 0;
  }

  a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--muted);
    padding-bottom: 2px;
  }

 /* --- IMAGES & ARTWORK LAYOUT --- */

  .artwork-layout {
    display: inline-flex;
    align-items: center;
    gap: 24px; /* Changed from 40px to strictly 24px */
    max-width: 100%;
  }

  .image-wrapper {
    display: flex;
    /* Removed max-height from here so it shrink-wraps the image tightly */
  }

  img {
    max-width: 100%;
    max-height: 60vh; /* Height constraint applied directly to the image */
    width: auto;
    height: auto;
    display: block; /* Removes the invisible ~4px descender gap below inline images */
    /* Removed object-fit: contain */
  }

  /* Desktop: Text on Right (Image on Left) */
  .artwork-layout.text-right {
    flex-direction: row;
    align-items: end;
  }

  /* Desktop: Text on Left (Image on Right) */
  .artwork-layout.text-left {
    flex-direction: row-reverse;
    align-items: end;
  }

  /* --- CAPTIONS --- */

  figcaption {
    font-size: 13px;
    width: 200px;
    flex-shrink: 0;
    
  }

  .artwork-layout.text-right figcaption {
    text-align: left;
  }

  .artwork-layout.text-left figcaption {
    text-align: right;
  }

  figcaption b {
    font-weight: bold;
    letter-spacing: 0.02em;
  }

  figcaption span {
    font-weight: normal;
    color: var(--muted);
  }

  /* --- SCROLL INDICATOR --- */

  .scroll-indicator {
    position: absolute;
    bottom: 30px;

    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;

    color: var(--muted);

    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { opacity: 0.3; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(3px); }
    100% { opacity: 0.3; transform: translateY(0); }
  }

  /* --- FIXED NAV --- */

  .fixed-nav {
    position: fixed;
    bottom: 24px;
    right: 24px;

    font-size: 10px;
    text-transform: uppercase;

    z-index: 50;
  }

  .fixed-nav a {
    border: none;
    font-weight: bold;
  }

  .fixed-nav a:hover {
    color: var(--muted);
  }

  /* --- DESKTOP NAVIGATION ROW (New Additions) --- */

  @media (min-width: 761px) {
    #header-nav {
      height: 90px !important;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 32px;
      cursor: default;
    }

    .nav-item {
      position: static;
      transform: none !important;
      opacity: 0.4 !important; /* Fade inactive items slightly */
      filter: none !important;
      pointer-events: auto !important;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .nav-item:hover {
      opacity: 0.8 !important;
    }

    .nav-item.active {
      opacity: 1 !important;
      font-weight: bold;

    }
  }

  /* --- MOBILE --- */

 /* --- MOBILE --- */

  @media (max-width: 760px) {
    img {
      max-height: 50vh; /* Moved height restriction directly to image */
    }

    /* Force vertical stack on mobile, aligning left edge of text with image */
    .artwork-layout,
    .artwork-layout.text-right,
    .artwork-layout.text-left {
      flex-direction: column;
      align-items: flex-start;
      gap: 24px; /* Uses gap to ensure exactly 24px vertically */
    }

    figcaption,
    .artwork-layout.text-right figcaption,
    .artwork-layout.text-left figcaption {
      margin-top: 0; /* Removed in favor of flex gap */
      text-align: left;
      width: 100%;
    }
  }
</style>
</head>

<body>

================================================== -->

<section id="contact" class="panel" data-title="CONTACT">
  <div class="outro-text">

      and post-fair orders, please get in touch.
    </p>

      <a href="mailto:hello@example.com">hello@example.com</a>
    </p>
    <p style="margin-top: 40px; color: var(--muted); font-size: 11px;">
      © 2026 YOUR NAME
    </p>
  </div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const headerNav = document.getElementById("header-nav");
  const panels = document.querySelectorAll(".panel");
  const navItems = [];

  let currentIndex = 0;
  let isExpanded = false;

  /* This is still the actual scrolling mechanism inside the expanded nav. */
  let navScrollOffset = 0;

  let isDragging = false;
  let startY = 0;
  let hoverTimeout;
  let lastScrollTop = window.scrollY;

  /* ==================================================
     HOVER / SCROLL STATE
  ================================================== */

  function disableHoversDuringScroll() {
    headerNav.classList.add("is-scrolling");
    clearTimeout(hoverTimeout);
    hoverTimeout = setTimeout(() => {
      headerNav.classList.remove("is-scrolling");
    }, 150);
  }

  /* ==================================================
     CLAMP NAVIGATION SCROLL
  ================================================== */

  function clampNavScroll() {
    const itemSpacing = 24;
    const maxOffset = Math.max(0, (currentIndex - 1) * itemSpacing);
    const minOffset = 0;

    if (navScrollOffset > maxOffset) {
      navScrollOffset = maxOffset;
    }
    if (navScrollOffset < minOffset) {
      navScrollOffset = minOffset;
    }
  }

  /* ==================================================
     COLLAPSE MENU
  ================================================== */

  function collapseMenu() {
    if (!isExpanded) return;
    isExpanded = false;
    headerNav.classList.remove("expanded");
    updateNav(true);
  }

  /* ==================================================
     BUILD HEADER NAVIGATION
  ================================================== */

  panels.forEach((panel, index) => {
    if (!panel.id) {
      panel.id = `panel-${index}`;
    }

    const item = document.createElement("div");
    item.classList.add("nav-item");
    item.textContent = panel.getAttribute("data-title");

    item.addEventListener("click", (e) => {
      e.stopPropagation();
      if (isDragging) return;

      // On desktop (width > 760) OR if expanded on mobile, scroll immediately to section.
      if (isExpanded || window.innerWidth > 760) {
        panel.scrollIntoView({ behavior: "smooth" });
        if (window.innerWidth <= 760) collapseMenu(); // Only collapse on mobile
      } else {
        navScrollOffset = 0;
        isExpanded = true;
        headerNav.classList.add("expanded");
        lastScrollTop = window.scrollY;
        updateNav(true);
      }
    });

    navItems.push(item);
    headerNav.appendChild(item);
  });

  /* ==================================================
     OUTER HEADER CLICK
  ================================================== */

  headerNav.addEventListener("click", () => {
    if (isDragging || window.innerWidth > 760) return; // Prevent expanding logic on desktop

    if (!isExpanded) {
      navScrollOffset = 0;
      isExpanded = true;
      headerNav.classList.add("expanded");
      lastScrollTop = window.scrollY;
      updateNav(true);
    } else {
      collapseMenu();
    }
  });

  /* ==================================================
     DESKTOP WHEEL SCROLL
  ================================================== */

  headerNav.addEventListener("wheel", (e) => {
      if (!isExpanded || window.innerWidth > 760) return; // Disabled on desktop
      e.preventDefault();
      disableHoversDuringScroll();
      navScrollOffset -= e.deltaY;
      clampNavScroll();
      updateNav(false);
    }, { passive: false }
  );

  /* ==================================================
     MOBILE TOUCH START
  ================================================== */

  headerNav.addEventListener("touchstart", (e) => {
      if (!isExpanded) return;
      startY = e.touches[0].clientY;
      isDragging = false;
    }, { passive: true }
  );

  /* ==================================================
     MOBILE TOUCH MOVE
  ================================================== */

  headerNav.addEventListener("touchmove", (e) => {
      if (!isExpanded) return;
      e.preventDefault();
      disableHoversDuringScroll();
      const y = e.touches[0].clientY;
      const deltaY = y - startY;

      if (Math.abs(deltaY) > 3) {
        isDragging = true;
      }

      navScrollOffset += deltaY;
      startY = y;
      clampNavScroll();
      updateNav(false);
    }, { passive: false }
  );

  /* ==================================================
     TOUCH END
  ================================================== */

  headerNav.addEventListener("touchend", () => {
      setTimeout(() => {
        isDragging = false;
      }, 50);
    }
  );

  /* ==================================================
     UPDATE NAVIGATION POSITIONS
  ================================================== */

  function updateNav(useTransition = true) {
    const itemSpacing = 24;
    const baseTy = 44; 

    navItems.forEach((item, i) => {
      item.style.setProperty("--t-duration", useTransition ? "0.8s" : "0s");
      item.classList.toggle("active", i === currentIndex);

      /* ----------------------------------------------
         EXPANDED
      ---------------------------------------------- */
      if (isExpanded) {
        item.style.setProperty(
          "--ty",
          `${baseTy + ((i - currentIndex) * itemSpacing) + navScrollOffset}px`
        );
        item.style.setProperty("--s", "1");
        item.style.setProperty("--o", i === currentIndex ? "1" : "0.4");
        item.style.setProperty("--b", "0px");
      }
      /* ----------------------------------------------
         COLLAPSED
      ---------------------------------------------- */
      else {
        if (i === currentIndex) {
          item.style.setProperty("--ty", "44px");
          item.style.setProperty("--s", "1");
          item.style.setProperty("--o", "1");
          item.style.setProperty("--b", "0px");
        }
        else if (i === currentIndex - 1) {
          item.style.setProperty("--ty", "20px");
          item.style.setProperty("--s", "0.9");
          item.style.setProperty("--o", "0");
          item.style.setProperty("--b", "2px");
        }
        else if (i === currentIndex - 2) {
          item.style.setProperty("--ty", "-4px");
          item.style.setProperty("--s", "0.8");
          item.style.setProperty("--o", "0");
          item.style.setProperty("--b", "3px");
        }
        else if (i === currentIndex + 1) {
          item.style.setProperty("--ty", "68px");
          item.style.setProperty("--s", "0.9");
          item.style.setProperty("--o", "0");
          item.style.setProperty("--b", "2px");
        }
        else if (i < currentIndex - 2) {
          item.style.setProperty("--ty", "-28px");
          item.style.setProperty("--s", "0.8");
          item.style.setProperty("--o", "0");
          item.style.setProperty("--b", "4px");
        }
        else {
          item.style.setProperty("--ty", "92px");
          item.style.setProperty("--s", "0.8");
          item.style.setProperty("--o", "0");
          item.style.setProperty("--b", "4px");
        }
      }
    });
  }

  /* ==================================================
     INTERSECTION OBSERVER
  ================================================== */

  const observer = new IntersectionObserver((entries) => {
      let changed = false;
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          currentIndex = Array.from(panels).indexOf(entry.target);
          changed = true;
        }
      });
      if (changed) {
        updateNav(true);
      }
    },
    { root: null, threshold: 0.5 }
  );

  panels.forEach((panel) => {
    observer.observe(panel);
  });

  /* ==================================================
     COLLAPSE HEADER WHEN PAGE ITSELF SCROLLS
  ================================================== */

  document.addEventListener("wheel", (e) => {
      if (isExpanded && !headerNav.contains(e.target)) {
        isExpanded = false;
        headerNav.classList.remove("expanded");
        updateNav(true);
      }
    }, { passive: true }
  );

  document.addEventListener("touchmove", (e) => {
      if (isExpanded && !headerNav.contains(e.target)) {
        isExpanded = false;
        headerNav.classList.remove("expanded");
        updateNav(true);
      }
    }, { passive: true }
  );

  /* ==================================================
     RESIZE
  ================================================== */

  window.addEventListener("resize", () => {
      if (isExpanded) {
        updateNav(false);
      }
    }
  );

  /* ==================================================
     INITIAL STATE
  ================================================== */

  updateNav(true);

});
</script>

</body>
</html>
