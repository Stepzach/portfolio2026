    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        
        html { 
           scroll-behavior: smooth; 
        }

        :root {
            --black: #111;
            --white: #fff;
            --grey: #888;
            --light: #e0e0e0;
        }

        body {
            background: var(--white);
            color: var(--black);
            font-family: 'IBM Plex Serif', Georgia, serif;
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
        }

        .container { 
            padding: 0 52px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ── ABOVE-FOLD WRAPPER ── */
        .above-fold {
            position: relative;
            height: 100svh;
            display: flex;
            flex-direction: column;
            scroll-snap-align: start; 
            scroll-snap-stop: always;
        }

        /* ── NAV ── */
        nav {
            flex-shrink: 0;
            padding: 36px 0;
            padding-bottom: 0px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            opacity: 0;
            animation: appear 0.6s 0.05s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        .nav-name {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 15px;
            letter-spacing: 0.04em;
            font-weight:400;
        }
        nav a {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            color: var(--grey);
            text-decoration: none;
            letter-spacing: 0.03em;
        }
        nav a:hover { color: var(--black); }

        /* ── HERO ── */
        .hero {
            flex: 1;           
            min-height: 0;      
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 80px;
            align-items: center;
            padding: 48px 0;
            opacity: 0;
            animation: appear 0.8s 0.15s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .hero-headline {
            font-size: clamp(32px, 5.5vw, 96px);
            font-weight: 300;
            line-height: 1.08;
            letter-spacing: -0.025em;
            margin-bottom: 48px;
        }
        .hero-headline em { font-style: italic; }

        .hero-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-top: 1px solid var(--light);
        }
        .meta-item {
            padding: 18px 0;
            border-bottom: 1px solid var(--light);
        }
        .meta-item:nth-child(odd)  { padding-right: 28px; border-right: 1px solid var(--light); }
        .meta-item:nth-child(even) { padding-left: 28px; }
        .meta-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--grey);
            display: block;
            margin-bottom: 7px;
        }
        .meta-value { font-size: 17px; font-weight: 400; line-height: 1.5; }

        .hero-photo {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .hero-photo img {
            width: 100%;
            max-height: calc(100dvh - 120px);
            object-fit: cover;
            object-position: center top;
            display: block;
        }
        .photo-caption {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--grey);
            letter-spacing: 0.06em;
            margin-top: 12px;
        }
        
        /* ── SCROLL INDICATOR ── */
        .scroll-indicator {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            opacity: 0;
            animation: appear 0.5s 0.8s forwards, float 2s ease-in-out infinite;
            pointer-events: none; 
            transition: opacity 0.4s ease;
        }
        .scroll-indicator.is-hidden {
            opacity: 0 !important;
        }
        .scroll-indicator span {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--grey);
        }

        /* ── SCROLL REVEAL CLASSES ── */
        .reveal-on-scroll {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: opacity, transform;
        }
        
        .reveal-on-scroll.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .delay-1 { transition-delay: 0.1s; }
        .delay-2 { transition-delay: 0.2s; }

        /* ── WORK SECTION ── */
        .projects-section {
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 56px 0; 
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        .work-header {
            padding: 0 0 28px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .section-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--grey);
        }

        .project {
            border-top: 1px solid var(--black);
            display: grid;
            grid-template-columns: 100px 1fr 500px;
            align-items: start;
            cursor: default;
        }
        
        .proj-index {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--grey);
            padding: 40px 0;
            border-right: 1px solid var(--light);
            letter-spacing: 0.06em;
        }
        .proj-body { padding: 40px 60px; }
        .proj-title-main {
            font-size: clamp(28px, 4.2vw, 72px);
            font-weight: 300;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
        }
        .proj-title-main em { font-style: italic; }
        .proj-title-main a { text-decoration: none; color: inherit; }
        .proj-sub {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--grey);
            letter-spacing: 0.04em;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .proj-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .proj-tags span {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--grey);
            border: 1px solid var(--light);
            padding: 7px 14px;
        }
        .proj-img-col {
            border-left: 1px solid var(--light);
            padding: 32px 40px;
            align-self: stretch;
            display: flex;
            align-items: center;
        }
        .proj-img-col img { width: 100%; display: block; }
        
        .proj-link-mobile {
            display: none;
        }

        /* ── FOOTER ── */
        footer {
            border-top: 1px solid var(--black);
            padding: 36px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        footer a {
            color: var(--black);
            font-size: 20px;
            font-weight: 400;
            text-decoration: none;
            border-bottom: 1px solid var(--black);
            padding-bottom: 1px;
        }
        footer a:hover { border-bottom-color: transparent; }
        .footer-mono {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--grey);
            letter-spacing: 0.04em;
        }

        /* ── LARGE SCREEN ENHANCEMENTS ── */
        @media (min-width: 1200px) {
            .container {
                padding: 0 72px;
            }
            nav {
                padding: 44px 0 0;
            }
            .nav-name {
                font-size: 16px;
            }
            .hero {
                grid-template-columns: 1fr 420px;
                gap: 100px;
                padding: 56px 0;
            }
            .hero-headline {
                font-size: clamp(48px, 6vw, 96px);
                margin-bottom: 56px;
            }
            .meta-item {
                padding: 22px 0;
            }
            .meta-value {
                font-size: 18px;
            }
            .hero-photo img {
                max-height: calc(100dvh - 110px);
            }
            .project {
                grid-template-columns: 120px 1fr 560px;
            }
            .proj-body {
                padding: 48px 72px;
            }
            .proj-img-col {
                padding: 40px 48px;
            }
            .proj-index {
                padding: 48px 0;
                font-size: 14px;
            }
            .proj-sub {
                font-size: 14px; 
            }
            footer {
                padding: 44px 0;
            }
            footer a {
                font-size: 22px;
            }
        }

        /* ── ANIMS ── */
        @keyframes appear {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 900px) {
            .hero { grid-template-columns: 1fr 260px; gap: 40px; }
            .project { grid-template-columns: 80px 1fr 420px; }
        }

        @media (min-width: 701px) {
            .proj-title-main:hover { cursor:pointer; }
            
            .emaillarge  { font-size:1.1rem; padding-top:18px }
            
         
        }

        @media (max-width: 700px) {
            .container { padding: 0 20px; }
            .hero {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                gap: 0;
                padding: 0;
                align-items: stretch;
            }
            .hero-photo {
                order: -1;
                height: 38svh;
                justify-content: flex-start;
                padding: 20px 0 16px;
            }
            .hero-photo img {
                width: auto;
                height: 100%;
                max-height: 100%;
                object-fit: cover;
                object-position: center;
            }
            .hero-text {
                padding: 16px 0 24px;
                overflow: hidden;
            }
            .hero-headline {
                font-size: clamp(28px, 8vw, 52px);
                margin-bottom: 20px;
            }
            .meta-value { font-size: 14px; }
            .meta-item { padding: 10px 0; }

            .project {
                grid-template-columns: 44px 1fr;
                grid-template-rows: auto auto;
            }
            .proj-body { padding: 20px 16px; }
            .proj-img-col {
                grid-column: 1 / span 2; 
                border-left: none;
                border-top: 1px solid var(--light);
                padding: 16px 0 24px 0; 
                display: block;
            }
            .proj-img-col img { 
                width: 100%;
                max-height: none;
                object-fit: cover; 
            }
            .proj-link-mobile {
                display: block;
                margin-top: 20px;
                padding: 0 16px;
                font-family: 'IBM Plex Mono', monospace;
                font-size: 12px;
                color: var(--black);
                text-decoration: none;
                letter-spacing: 0.04em;
                width: fit-content;
                text-underline-offset: 5px; 
                padding-bottom: 2px;
            }
            footer { flex-direction: column; gap: 12px; text-align: center; }
        }

<script>
    document.addEventListener('scroll', () => {
        const indicator = document.querySelector('.scroll-indicator');
        if (indicator) {
            if (window.scrollY > 30) {
                indicator.classList.add('is-hidden');
            } else {
                indicator.classList.remove('is-hidden');
            }
        }
    });

    document.addEventListener("DOMContentLoaded", () => {
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.15
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target); 
                }
            });
        }, observerOptions);

        const revealElements = document.querySelectorAll('.reveal-on-scroll');
        revealElements.forEach(el => observer.observe(el));
    });
</script>
